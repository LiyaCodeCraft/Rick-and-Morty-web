<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Rick and Morty - Characters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-container">
    <header>
      <h1>Rick and Morty</h1>
      <nav>
        <a href="index.html" class="nav-pill-btn">Home</a>
        <a href="storytime.html" class="nav-pill-btn">StoryTime</a>
        <a href="episodes.html" class="nav-pill-btn">Episodes</a>
        <a href="characters.html" class="nav-pill-btn active">Characters</a>
        <a href="gadgets.html" class="nav-pill-btn">Gadgets &amp; Inventions</a>
      </nav>
    </header>

    <main>
      <h2 class="page-title">Multiverse Primary Characters</h2>

      <!-- Mandarin Grid Layout: 3 Columns with Images next to Text (Matching Design image_9.png) -->
      <section class="characters-grid-view">
        <!-- Rick -->
        <article class="char-card-design">
          <img src="images/Rick.png" alt="Rick Sanchez">
          <div class="char-text-box">
            <h3>Rick Sanchez</h3>
            <p>C-137 mad scientist, smartest man in the multiverse.</p>
          </div>
        </article>

        <!-- Morty -->
        <article class="char-card-design">
          <img src="images/morty.png" alt="Morty Smith">
          <div class="char-text-box">
            <h3>Morty Smith</h3>
            <p>Rick's anxious teenage grandson, moral compass.</p>
          </div>
        </article>

        <!-- Summer -->
        <article class="char-card-design">
          <img src="images/summer.png" alt="Summer Smith">
          <div class="char-text-box">
            <h3>Summer Smith</h3>
            <p>Rick's capable, chaotic, teenage granddaughter.</p>
          </div>
        </article>
      </section>
    </main>
  </div>

</body>
